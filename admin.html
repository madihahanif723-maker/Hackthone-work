<!doctype html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>QUICKServe Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#4f46e5' } } } }</script>
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        .glass {
            backdrop-filter: blur(14px);
            background: rgba(255, 255, 255, .72)
        }

        .dark .glass {
            background: rgba(15, 23, 42, .72)
        }

        .page {
            animation: fade .3s ease
        }

        .card {
            transition: transform .2s, box-shadow .2s
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(15, 23, 42, .08)
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .sidebar {
            transition: transform .25s
        }

        .modal {
            animation: modal .2s ease
        }

        @keyframes modal {
            from {
                opacity: 0;
                transform: scale(.96)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px
        }

        ::-webkit-scrollbar-thumb {
            background: #a5b4fc;
            border-radius: 99px
        }
    </style>
</head>

<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="login"
        class="min-h-screen hidden items-center justify-center p-5 bg-gradient-to-br from-indigo-50 via-white to-blue-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950">
        <div
            class="w-full max-w-md rounded-3xl bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 shadow-2xl p-8">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white grid place-items-center"><i
                        class="fa-solid fa-bolt"></i></div>
                <div>
                    <h1 class="font-black text-2xl">QUICKServe Admin</h1>
                    <p class="text-sm text-slate-500">Manage your home-service platform with ease.</p>
                </div>
            </div>
            <h2 class="text-2xl font-bold mb-1">Welcome Back, Admin</h2>
            <p class="text-slate-500 mb-6">Sign in to continue to your dashboard.</p>
            <form id="loginForm" class="space-y-4"><label class="block"><span
                        class="text-sm font-semibold">Email</span><input id="adminEmail" type="email" required
                        value="admin@quickserve.com"
                        class="mt-1 w-full rounded-xl border p-3 bg-transparent"></label><label class="block"><span
                        class="text-sm font-semibold">Password</span>
                    <div class="relative"><input id="adminPass" type="password" required value="admin123"
                            class="mt-1 w-full rounded-xl border p-3 pr-12 bg-transparent"><button type="button"
                            onclick="togglePass()" class="absolute right-3 top-3 text-slate-500"><i id="eye"
                                class="fa-solid fa-eye"></i></button></div>
                </label><label class="flex gap-2 items-center text-sm"><input id="remember" type="checkbox" checked>
                    Remember session</label><button
                    class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold">Login to
                    Dashboard</button></form>
            <p class="text-xs text-slate-400 mt-5 text-center">Demo: admin@quickserve.com / admin123</p>
        </div>
    </div>
    <div id="app" class="hidden min-h-screen">
        <aside id="sidebar"
            class="sidebar fixed z-40 inset-y-0 left-0 w-72 -translate-x-full lg:translate-x-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
            <div class="h-20 px-6 flex items-center gap-3 border-b border-slate-200 dark:border-slate-800">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white grid place-items-center"><i
                        class="fa-solid fa-bolt"></i></div>
                <div><b>QUICKServe</b>
                    <div class="text-xs text-slate-500">Admin Panel</div>
                </div><button onclick="closeSidebar()" class="lg:hidden ml-auto"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <nav id="nav" class="p-4 space-y-1 overflow-auto"></nav>
            <div class="mt-auto p-4 border-t border-slate-200 dark:border-slate-800"><button onclick="go('settings')"
                    class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                    <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center font-bold">A
                    </div><span class="text-left flex-1"><b class="block text-sm">Admin</b><small
                            class="text-slate-500">Administrator</small></span><i
                        class="fa-solid fa-chevron-right text-xs"></i>
                </button><button onclick="logout()"
                    class="w-full mt-2 p-3 text-left rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30"><i
                        class="fa-solid fa-right-from-bracket mr-2"></i> Logout</button></div>
        </aside>
        <div id="backdrop" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>
        <main class="lg:ml-72 min-h-screen">
            <header
                class="sticky top-0 z-20 h-20 px-4 md:px-8 glass border-b border-slate-200/70 dark:border-slate-800/70 flex items-center gap-4">
                <button onclick="openSidebar()" class="lg:hidden p-2"><i class="fa-solid fa-bars"></i></button>
                <div class="flex-1">
                    <h1 id="pageTitle" class="font-bold text-xl">Dashboard</h1>
                    <p class="hidden sm:block text-xs text-slate-500">QUICKServe management center</p>
                </div>
                <div class="relative hidden md:block"><input id="globalSearch" oninput="globalSearchFn()"
                        placeholder="Search anything..."
                        class="w-64 rounded-xl border bg-white/70 dark:bg-slate-900/70 px-4 py-2.5 text-sm">
                    <div id="searchResults"
                        class="absolute top-12 left-0 w-80 bg-white dark:bg-slate-900 border rounded-xl shadow-xl hidden p-2">
                    </div>
                </div><button onclick="showNotifications()"
                    class="relative p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800"><i
                        class="fa-regular fa-bell"></i><span id="notifBadge"
                        class="absolute -top-1 -right-1 w-5 h-5 text-[10px] rounded-full bg-red-500 text-white grid place-items-center">0</span></button><button
                    onclick="toggleTheme()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800"><i
                        id="themeIcon" class="fa-solid fa-moon"></i></button>
                <div class="hidden sm:block text-right"><b class="text-sm">Admin</b>
                    <div class="text-xs text-slate-500">Administrator</div>
                </div>
            </header>
            <section id="content" class="p-4 md:p-8"></section>
        </main>
    </div>
    <div id="modalRoot"></div>
    <script>
        const KEY = { users: 'quickserve_users', providers: 'quickserve_providers', bookings: 'quickserve_bookings', reviews: 'quickserve_reviews', services: 'quickserve_services', notifications: 'quickserve_notifications', settings: 'quickserve_settings', theme: 'quickserve_theme', current: 'quickserve_current_user' };
        const cats = ['Electrician', 'Plumber', 'Carpenter', 'Cleaner', 'Painter', 'AC Technician', 'Appliance Repair', 'Home Tutor'];
        const icons = { 'Electrician': 'fa-bolt', 'Plumber': 'fa-faucet-drip', 'Carpenter': 'fa-hammer', 'Cleaner': 'fa-broom', 'Painter': 'fa-paint-roller', 'AC Technician': 'fa-snowflake', 'Appliance Repair': 'fa-screwdriver-wrench', 'Home Tutor': 'fa-graduation-cap' };
        const demoProviders = [['Ali Electric Services', 'Electrician', 'Karachi', 5, 4.9, 2500], ['Muhammad Ahmed Plumbing', 'Plumber', 'Lahore', 7, 4.8, 1800], ['Usman Carpenter Works', 'Carpenter', 'Islamabad', 6, 4.9, 3000], ['Sara Home Cleaning', 'Cleaner', 'Karachi', 4, 4.9, 1500], ['Hassan AC Services', 'AC Technician', 'Rawalpindi', 8, 4.8, 2500], ['Bilal Painters', 'Painter', 'Lahore', 9, 4.7, 2200], ['Ayesha Appliance Repair', 'Appliance Repair', 'Karachi', 5, 4.9, 2000], ['Hamza Home Services', 'Home Tutor', 'Islamabad', 6, 4.8, 1800]];
        function get(k, f = []) { try { return JSON.parse(localStorage.getItem(k)) ?? f } catch { return f } } function set(k, v) { localStorage.setItem(k, JSON.stringify(v)) } function id(prefix = 'QS') { return prefix + '-' + Math.random().toString(36).slice(2, 8).toUpperCase() } function esc(s = '') { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
        function seed() { if (!localStorage.getItem(KEY.users)) set(KEY.users, []); if (!localStorage.getItem(KEY.providers)) { set(KEY.providers, demoProviders.map((p, i) => ({ id: 'p' + i, name: p[0], service: p[1], category: p[1], location: p[2], experience: p[3], rating: p[4], reviews: 20 + i, price: p[5], status: 'APPROVED', bio: 'Trusted local professional providing reliable home services.', services: [p[1]], image: 'https://i.pravatar.cc/150?img=' + (12 + i) }))) } if (!localStorage.getItem(KEY.bookings)) set(KEY.bookings, []); if (!localStorage.getItem(KEY.reviews)) set(KEY.reviews, []); if (!localStorage.getItem(KEY.services)) set(KEY.services, cats.map((name, i) => ({ id: 's' + i, name, description: 'Professional ' + name + ' services', icon: icons[name], status: 'Active' }))); if (!localStorage.getItem(KEY.notifications)) set(KEY.notifications, []); }
        function init() { seed(); const t = localStorage.getItem(KEY.theme) || 'light'; document.documentElement.classList.toggle('dark', t === 'dark'); const u = get(KEY.current, null); if (u?.role === 'admin') { showApp(); go('dashboard') } else showLogin(); }
        function showLogin() { document.getElementById('login').classList.remove('hidden'); document.getElementById('login').classList.add('flex'); document.getElementById('app').classList.add('hidden') } function showApp() { document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); renderNav(); updateBadge() }
        function togglePass() { const x = document.getElementById('adminPass'); x.type = x.type === 'password' ? 'text' : 'password'; document.getElementById('eye').className = x.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash' }
        document.getElementById('loginForm').onsubmit = e => { e.preventDefault(); if (document.getElementById('adminEmail').value === 'admin@quickserve.com' && document.getElementById('adminPass').value === 'admin123') { set(KEY.current, { id: 'admin', name: 'Admin', email: 'admin@quickserve.com', role: 'admin' }); Swal.fire({ icon: 'success', title: 'Welcome, Admin!', timer: 1200, showConfirmButton: false }).then(showApp); go('dashboard') } else Swal.fire('Login Failed', 'Use the demo admin credentials shown below.', 'error') };
        const menus = [['dashboard', 'fa-chart-pie', 'Dashboard'], ['users', 'fa-users', 'Users'], ['providers', 'fa-user-gear', 'Service Providers'], ['bookings', 'fa-clipboard-list', 'Bookings'], ['services', 'fa-screwdriver-wrench', 'Services'], ['reviews', 'fa-star', 'Reviews'], ['reports', 'fa-chart-line', 'Reports'], ['notifications', 'fa-bell', 'Notifications'], ['settings', 'fa-gear', 'Settings']];
        function renderNav() { document.getElementById('nav').innerHTML = menus.map(x => `<button data-page="${x[0]}" onclick="go('${x[0]}')" class="navitem w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold hover:bg-indigo-50 dark:hover:bg-indigo-950/40"><i class="fa-solid ${x[1]} w-5"></i>${x[2]}</button>`).join('') }
        function go(page) { closeSidebar(); document.querySelectorAll('.navitem').forEach(b => b.classList.toggle('bg-indigo-600', b.dataset.page === page)); document.querySelectorAll('.navitem').forEach(b => b.classList.toggle('text-white', b.dataset.page === page)); const titles = { dashboard: 'Dashboard', users: 'User Management', providers: 'Service Providers', bookings: 'Booking Management', services: 'Service Categories', reviews: 'Reviews & Ratings', reports: 'Reports & Analytics', notifications: 'Notifications', settings: 'Settings' }; document.getElementById('pageTitle').textContent = titles[page]; ({ dashboard: dashboard, users: usersPage, providers: providersPage, bookings: bookingsPage, services: servicesPage, reviews: reviewsPage, reports: reportsPage, notifications: notificationsPage, settings: settingsPage }[page])() }
        function openSidebar() { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden') } function closeSidebar() { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden') } function toggleTheme() { const d = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', d); localStorage.setItem(KEY.theme, d ? 'dark' : 'light'); document.getElementById('themeIcon').className = d ? 'fa-solid fa-sun' : 'fa-solid fa-moon'; renderCurrent() }
        let currentPage = 'dashboard'; function renderCurrent() { go(currentPage) }
        function stat(label, value, icon, extra = '') { return `<div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><div class="flex justify-between"><div><p class="text-xs font-bold text-slate-500 uppercase">${label}</p><h3 class="text-2xl font-black mt-2">${value}</h3><p class="text-xs text-slate-500 mt-1">${extra}</p></div><div class="w-11 h-11 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 grid place-items-center"><i class="fa-solid ${icon}"></i></div></div></div>` }
        function status(s) { let c = { 'PENDING': 'bg-amber-100 text-amber-700', 'ACCEPTED': 'bg-blue-100 text-blue-700', 'IN PROGRESS': 'bg-purple-100 text-purple-700', 'COMPLETED': 'bg-emerald-100 text-emerald-700', 'REJECTED': 'bg-red-100 text-red-700', 'CANCELLED': 'bg-slate-200 text-slate-600', 'APPROVED': 'bg-emerald-100 text-emerald-700', 'SUSPENDED': 'bg-red-100 text-red-700', 'PENDING APPROVAL': 'bg-amber-100 text-amber-700', 'VISIBLE': 'bg-emerald-100 text-emerald-700', 'HIDDEN': 'bg-slate-200 text-slate-600' }[s] || 'bg-slate-100 text-slate-600'; return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${c}">${esc(s)}</span>` }
        function tableWrap(head, body) { return `<div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800"><table class="w-full text-sm"><thead class="bg-slate-50 dark:bg-slate-800/60"><tr>${head.map(h => `<th class="text-left px-4 py-3 font-bold text-slate-500 whitespace-nowrap">${h}</th>`).join('')}</tr></thead><tbody>${body || `<tr><td colspan="${head.length}" class="p-12 text-center text-slate-500"><i class="fa-regular fa-folder-open text-3xl mb-3 block"></i>No records found</td></tr>`}</tbody></table></div>` }
        function dashboard() { currentPage = 'dashboard'; const us = get(KEY.users), ps = get(KEY.providers), bs = get(KEY.bookings), rs = get(KEY.reviews); const completed = bs.filter(x => x.status === 'COMPLETED').length, pending = bs.filter(x => x.status === 'PENDING').length, revenue = bs.filter(x => x.status === 'COMPLETED').reduce((a, b) => a + Number(b.price || b.amount || 0), 0); document.getElementById('content').innerHTML = `<div class="page space-y-7"><div><h2 class="text-3xl font-black">Good Morning, Admin 👋</h2><p class="text-slate-500 mt-1">Here's what's happening on QUICKServe today.</p></div><div class="grid sm:grid-cols-2 xl:grid-cols-6 gap-4">${stat('Total Users', us.length, 'fa-users')}${stat('Service Providers', ps.length, 'fa-user-gear')}${stat('Total Bookings', bs.length, 'fa-calendar-check')}${stat('Completed Jobs', completed, 'fa-circle-check')}${stat('Total Revenue', 'PKR ' + revenue.toLocaleString(), 'fa-wallet')}${stat('Pending Requests', pending, 'fa-hourglass-half')}</div><div class="grid xl:grid-cols-3 gap-5"><div class="xl:col-span-2 bg-white dark:bg-slate-900 border rounded-2xl p-5"><h3 class="font-bold mb-4">Booking Overview</h3><canvas id="bookingChart" height="120"></canvas></div><div class="bg-white dark:bg-slate-900 border rounded-2xl p-5"><h3 class="font-bold mb-4">Service Performance</h3><canvas id="serviceChart"></canvas></div></div><div class="grid xl:grid-cols-3 gap-5"><div class="xl:col-span-2 bg-white dark:bg-slate-900 border rounded-2xl p-5"><div class="flex justify-between mb-4"><h3 class="font-bold">Recent Bookings</h3><button onclick="go('bookings')" class="text-indigo-600 text-sm font-bold">View all</button></div>${recentBookings(bs, 5)}</div><div class="bg-white dark:bg-slate-900 border rounded-2xl p-5"><h3 class="font-bold mb-4">Recent Users</h3>${us.slice(-5).reverse().map(u => `<div class="flex items-center gap-3 py-3 border-b last:border-0 dark:border-slate-800"><div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center font-bold">${esc((u.name || 'U')[0])}</div><div class="flex-1"><b class="text-sm">${esc(u.name)}</b><p class="text-xs text-slate-500">${esc(u.email || '')} · ${esc(u.role || 'Customer')}</p></div></div>`).join('') || '<p class="text-slate-500 text-sm">No users yet.</p>'}</div></div></div>`; setTimeout(charts, 0) }
        function recentBookings(bs, n) { if (!bs.length) return '<div class="py-12 text-center text-slate-500">No bookings yet.</div>'; const ps = get(KEY.providers), us = get(KEY.users); return tableWrap(['Booking ID', 'Customer', 'Provider', 'Service', 'Date', 'Amount', 'Status', ''], bs.slice().reverse().slice(0, n).map(b => { const u = us.find(x => x.id === b.customerId) || {}, p = ps.find(x => x.id === b.providerId) || {}; return `<tr class="border-t dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50"><td class="px-4 py-3 font-bold">#${esc(b.id || 'QS')}</td><td class="px-4 py-3">${esc(b.customerName || u.name || 'Customer')}</td><td class="px-4 py-3">${esc(b.providerName || p.name || 'Provider')}</td><td class="px-4 py-3">${esc(b.service || b.category || p.service || '-')}</td><td class="px-4 py-3 whitespace-nowrap">${esc(b.date || '-')}</td><td class="px-4 py-3">PKR ${Number(b.price || b.amount || 0).toLocaleString()}</td><td class="px-4 py-3">${status(b.status || 'PENDING')}</td><td class="px-4 py-3"><button onclick="viewBooking('${esc(b.id)}')" class="text-indigo-600 font-bold">View</button></td></tr>` }).join('')) }
        function charts() { const dark = document.documentElement.classList.contains('dark'), grid = dark ? 'rgba(148,163,184,.15)' : 'rgba(100,116,139,.15)', text = dark ? '#cbd5e1' : '#475569', bs = get(KEY.bookings); const counts = ['PENDING', 'ACCEPTED', 'IN PROGRESS', 'COMPLETED', 'CANCELLED'].map(s => bs.filter(b => b.status === s).length); if (window.bc) bc.destroy(); if (window.sc) sc.destroy(); bc = new Chart(document.getElementById('bookingChart'), { type: 'bar', data: { labels: ['Pending', 'Accepted', 'In Progress', 'Completed', 'Cancelled'], datasets: [{ label: 'Bookings', data: counts, borderRadius: 8 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { color: grid }, ticks: { color: text } }, y: { beginAtZero: true, grid: { color: grid }, ticks: { color: text } } } } }); const labels = cats, vals = labels.map(c => bs.filter(b => (b.service || b.category) == c).length); sc = new Chart(document.getElementById('serviceChart'), { type: 'doughnut', data: { labels, datasets: [{ data: vals }] }, options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: text } } } } }) }
        function toolbar(search = 'Search...', extra = '') { return `<div class="flex flex-col md:flex-row gap-3 mb-5"><input id="pageSearch" oninput="renderCurrent()" placeholder="${search}" class="flex-1 rounded-xl border bg-white dark:bg-slate-900 px-4 py-3">${extra}</div>` }
        function usersPage() { currentPage = 'users'; const q = (document.getElementById('pageSearch')?.value || '').toLowerCase(), us = get(KEY.users).filter(u => (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)); document.getElementById('content').innerHTML = `<div class="page"><div class="mb-6"><h2 class="text-3xl font-black">User Management</h2><p class="text-slate-500">Manage customers, providers and administrators.</p></div>${toolbar('Search users...', '<select id="roleFilter" onchange="renderCurrent()" class="rounded-xl border bg-white dark:bg-slate-900 px-4 py-3"><option>All Roles</option><option>Customer</option><option>Service Provider</option><option>Admin</option></select>')} ${tableWrap(['User', 'Email', 'Phone', 'Role', 'Joined', 'Status', 'Actions'], us.map(u => `<tr class="border-t dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50"><td class="px-4 py-3 font-bold">${esc(u.name)}</td><td class="px-4 py-3">${esc(u.email || '-')}</td><td class="px-4 py-3">${esc(u.phone || '-')}</td><td class="px-4 py-3">${esc(u.role || 'Customer')}</td><td class="px-4 py-3">${esc(u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-')}</td><td class="px-4 py-3">${status(u.status || 'Active')}</td><td class="px-4 py-3 whitespace-nowrap"><button onclick="viewUser('${esc(u.id)}')" class="text-indigo-600 mr-2">View</button><button onclick="toggleUser('${esc(u.id)}')" class="text-amber-600 mr-2">${u.status === 'Suspended' ? 'Activate' : 'Suspend'}</button><button onclick="deleteUser('${esc(u.id)}')" class="text-red-500">Delete</button></td></tr>`).join(''))}</div>` }

        function serviceModal(i) { const s = get(KEY.services).find(x => x.id === i) || { id: '', name: '', description: '', icon: 'fa-wrench', status: 'Active' }; modal(`<div class="p-6"><div class="flex justify-between"><h2 class="text-xl font-black">${i ? 'Edit Service' : 'Add New Service'}</h2><button onclick="closeModal()">✕</button></div><div class="space-y-4 mt-5"><input id="sn" value="${esc(s.name)}" placeholder="Service Name" class="w-full border rounded-xl p-3 bg-transparent"><input id="sd" value="${esc(s.description)}" placeholder="Description" class="w-full border rounded-xl p-3 bg-transparent"><input id="si" value="${esc(s.icon)}" placeholder="Font Awesome class e.g. fa-bolt" class="w-full border rounded-xl p-3 bg-transparent"><select id="ss" class="w-full border rounded-xl p-3 bg-transparent"><option ${s.status === 'Active' ? 'selected' : ''}>Active</option><option ${s.status === 'Disabled' ? 'selected' : ''}>Disabled</option></select><button onclick="saveService('${esc(i || '')}')" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold">Save Service</button></div></div>`) } function saveService(i) { const a = get(KEY.services); let s = a.find(x => x.id === i); if (!s) { s = { id: id('S') }; a.push(s) } s.name = document.getElementById('sn').value.trim(); s.description = document.getElementById('sd').value.trim(); s.icon = document.getElementById('si').value.trim() || 'fa-wrench'; s.status = document.getElementById('ss').value; if (!s.name) return Swal.fire('Required', 'Enter a service name.', 'warning'); set(KEY.services, a); closeModal(); Swal.fire('Saved', 'Service saved successfully.', 'success'); renderCurrent() } function deleteService(i) { confirm('Delete service?', 'This category will be removed.', () => { set(KEY.services, get(KEY.services).filter(x => x.id !== i)); Swal.fire('Deleted', 'Service deleted.', 'success'); renderCurrent() }) }
        function toggleReview(i) { const a = get(KEY.reviews), r = a.find(x => x.id === i); r.status = String(r.status).toUpperCase() === 'HIDDEN' ? 'VISIBLE' : 'HIDDEN'; set(KEY.reviews, a); Swal.fire('Updated', 'Review visibility changed.', 'success'); renderCurrent() } function deleteReview(i) { confirm('Delete review?', 'This action cannot be undone.', () => { set(KEY.reviews, get(KEY.reviews).filter(x => x.id !== i)); Swal.fire('Deleted', 'Review deleted.', 'success'); renderCurrent() }) }
        function markRead() { const a = get(KEY.notifications).map(n => ({ ...n, read: true })); set(KEY.notifications, a); updateBadge(); renderCurrent() } function updateBadge() { document.getElementById('notifBadge').textContent = get(KEY.notifications).filter(n => !n.read).length } function pushNotif(title, message) { const a = get(KEY.notifications); a.push({ id: id('N'), title, message, time: new Date().toLocaleString(), read: false }); set(KEY.notifications, a); updateBadge() } function showNotifications() { const ns = get(KEY.notifications).filter(n => !n.read); modal(`<div class="p-6"><div class="flex justify-between"><h2 class="text-xl font-black">Notifications</h2><button onclick="closeModal()">✕</button></div><div class="mt-5 space-y-3">${ns.map(n => `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><b>${esc(n.title)}</b><p class="text-sm text-slate-500">${esc(n.message)}</p></div>`).join('') || '<p class="text-slate-500 py-8 text-center">You are all caught up.</p>'}</div><button onclick="markRead();closeModal()" class="mt-5 w-full py-3 rounded-xl bg-indigo-600 text-white font-bold">Mark all as read</button></div>`) }
        function saveSettings(e) { e.preventDefault(); const f = new FormData(e.target), s = { adminName: f.get('adminName'), email: f.get('email'), phone: f.get('phone'), supportEmail: f.get('supportEmail'), supportPhone: f.get('supportPhone'), emailNotifications: f.has('emailNotifications'), bookingNotifications: f.has('bookingNotifications'), providerNotifications: f.has('providerNotifications'), reviewNotifications: f.has('reviewNotifications') }; set(KEY.settings, s); Swal.fire({ icon: 'success', title: 'Settings saved', timer: 1000, showConfirmButton: false }) }
        function globalSearchFn() { const q = document.getElementById('globalSearch').value.toLowerCase().trim(), box = document.getElementById('searchResults'); if (!q) { box.classList.add('hidden'); return } const out = []; get(KEY.users).filter(x => (x.name || '').toLowerCase().includes(q)).slice(0, 3).forEach(x => out.push(`<button onclick="go('users');viewUser('${esc(x.id)}')" class="block w-full text-left p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">👤 ${esc(x.name)}</button>`)); get(KEY.providers).filter(x => (x.name || '').toLowerCase().includes(q)).slice(0, 3).forEach(x => out.push(`<button onclick="go('providers');viewProvider('${esc(x.id)}')" class="block w-full text-left p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">🔧 ${esc(x.name)}</button>`)); get(KEY.bookings).filter(x => String(x.id).toLowerCase().includes(q)).slice(0, 3).forEach(x => out.push(`<button onclick="go('bookings');viewBooking('${esc(x.id)}')" class="block w-full text-left p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">📋 #${esc(x.id)}</button>`)); box.innerHTML = out.join('') || '<p class="p-3 text-sm text-slate-500">No results</p>'; box.classList.remove('hidden') }
        function logout() { confirm('Logout from admin panel?', 'Your admin session will end.', () => { localStorage.removeItem(KEY.current); showLogin() }) }
        window.addEventListener('storage', () => { if (!document.getElementById('app').classList.contains('hidden')) renderCurrent(); updateBadge() }); window.addEventListener('load', init);
    </script>
</body>
